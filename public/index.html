<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up Page</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

<div class="container" id="container">
    <!-- Sign Up Form Section -->
    <div class="form-container sign-up-container">
    <form action="/api/signup" method="POST"> <!-- Updated action & method -->
        <h1>Create Account</h1>
        <span>or use your email for registration</span>
        <input type="text" name="name" placeholder="Name" required />
        <input type="email" name="email" placeholder="Email" required /> <!-- Added name attribute -->
        <input type="password" name="password" placeholder="Password" required /> <!-- Added name attribute -->
        <button type="submit">Sign Up</button>
    </form>
</div>


    <!-- Login Form Section -->
    <div class="form-container sign-in-container">
    <form action="/api/login" method="POST"> <!-- Updated action & method -->
        <h1>Sign In</h1>
        <span>or use your account</span>
        <input type="email" name="email" placeholder="Email" required /> <!-- Added name attribute -->
        <input type="password" name="password" placeholder="Password" required /> <!-- Added name attribute -->
        <a href="#" class="forgot-password">Forgot your password?</a>
        <button type="submit">Sign In</button>
    </form>
</div>

    <!-- Sliding Overlay Panels -->
    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>Welcome Back!</h1>
                <p>To keep connected with us please login with your personal info</p>
                <button class="ghost" id="signIn">Sign In</button>
            </div>
            <div class="overlay-panel overlay-right">
                <h1>Hello, Friend!</h1>
                <p>Enter your personal details and start your journey with us</p>
                <button class="ghost" id="signUp">Sign Up</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
